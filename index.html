<body>

<div class="container">

    <section class="hero">
        <div class="logo">♟</div>
        <h1>Arena Analyzer</h1>
        <div class="subtitle">
            Analyze Chess.com Arenas and combine player & club results
        </div>
    </section>


    <!-- INPUT -->

    <section class="card">

        <div class="card-title">
            🔗 Arena Links
        </div>

        <div id="arenaInputs">

            <div class="arena-row">
                <input
                    class="arena-input"
                    type="url"
                    placeholder="https://www.chess.com/tournament/live/..."
                >
                <button class="remove-btn" onclick="removeArena(this)">×</button>
            </div>

        </div>

        <div class="buttons">

            <button class="add-btn" onclick="addArena()">
                ＋ Add Arena
            </button>

            <button class="analyze-btn" onclick="analyzeArenas()">
                🔍 Analyze Arenas
            </button>

            <button class="clear-btn" onclick="clearAll()">
                Clear
            </button>

        </div>

        <div id="status" class="status"></div>

    </section>


    <!-- SUMMARY -->

    <div id="results" style="display:none;">

        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="arenaCount">0</div>
                <div class="stat-label">Arenas</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="playerCount">0</div>
                <div class="stat-label">Players</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="clubCount">0</div>
                <div class="stat-label">Clubs</div>
            </div>

        </div>


        <!-- SEPARATE ARENAS -->

        <section class="card">

            <div class="card-title">
                🏟️ Separate Arena Results
            </div>

            <div id="separateResults"></div>

        </section>


        <!-- COMBINED PLAYERS -->

        <section class="card">

            <div class="card-title">
                👤 Combined Player Results
            </div>

            <div id="playerResults"></div>

        </section>


        <!-- COMBINED CLUBS -->

        <section class="card">

            <div class="card-title">
                🏆 Combined Club Results
            </div>

            <div id="clubResults"></div>

        </section>

    </div>


    <footer>
        Arena Analyzer • Built for Chess.com Arena analysis
    </footer>

</div>


<script>

/*
    ==========================================================
    ARENA ANALYZER
    ==========================================================

    This is a completely client-side version.

    There is no Python backend.
    There is no external CSS.
    There is no external JavaScript.

    Everything is contained in this HTML file.
*/


let arenaCounter = 1;


/* ==========================================================
   INPUT MANAGEMENT
   ========================================================== */

function addArena() {

    arenaCounter++;

    const container = document.getElementById("arenaInputs");

    const row = document.createElement("div");

    row.className = "arena-row";

    row.innerHTML = `
        <input
            class="arena-input"
            type="url"
            placeholder="https://www.chess.com/tournament/live/..."
        >

        <button
            class="remove-btn"
            onclick="removeArena(this)"
        >
            ×
        </button>
    `;

    container.appendChild(row);
}


function removeArena(button) {

    const rows =
        document.querySelectorAll(".arena-row");

    if (rows.length === 1) {
        rows[0].querySelector("input").value = "";
        return;
    }

    button.parentElement.remove();
}


/* ==========================================================
   STATUS
   ========================================================== */

function showStatus(message, error = false) {

    const status =
        document.getElementById("status");

    status.innerHTML = message;

    status.className =
        "status show" + (error ? " error" : "");
}


/* ==========================================================
   URL PARSER
   ========================================================== */

function extractTournamentId(url) {

    try {

        const parsed = new URL(url);

        /*
            Handles URLs such as:

            /tournament/live/123456
            /tournament/live/name-123456
        */

        const parts =
            parsed.pathname.split("/").filter(Boolean);

        const liveIndex =
            parts.indexOf("live");

        if (liveIndex !== -1 && parts[liveIndex + 1]) {

            return parts[liveIndex + 1];

        }

        return null;

    } catch {

        return null;

    }
}


/* ==========================================================
   CHESS.COM API JSONP
   ==========================================================

   Chess.com's PubAPI supports JSONP.

   This allows a static GitHub Pages website to request
   public API data without needing Python.
*/


function chessApi(endpoint) {

    return new Promise((resolve, reject) => {

        const callbackName =
            "arenaAnalyzerCallback_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2);

        const script =
            document.createElement("script");

        const timeout =
            setTimeout(() => {

                cleanup();

                reject(
                    new Error(
                        "Chess.com API request timed out."
                    )
                );

            }, 15000);


        window[callbackName] =
            function(data) {

                clearTimeout(timeout);

                cleanup();

                resolve(data);

            };


        function cleanup() {

            delete window[callbackName];

            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }

        }


        script.onerror = function() {

            clearTimeout(timeout);

            cleanup();

            reject(
                new Error(
                    "Could not access Chess.com API."
                )
            );

        };


        script.src =
            "https://api.chess.com/pub/tournament/" +
            encodeURIComponent(endpoint) +
            "?callback=" +
            encodeURIComponent(callbackName);


        document.body.appendChild(script);

    });
}


/* ==========================================================
   ANALYZE
   ========================================================== */

async function analyzeArenas() {

    const inputs =
        document.querySelectorAll(".arena-input");

    const urls =
        Array.from(inputs)
            .map(input => input.value.trim())
            .filter(Boolean);


    if (!urls.length) {

        showStatus(
            "Please add at least one Chess.com Arena link.",
            true
        );

        return;
    }


    showStatus(
        "⏳ Loading Arena data from Chess.com..."
    );


    const arenas = [];

    const combinedPlayers = {};

    const combinedClubs = {};


    for (let i = 0; i < urls.length; i++) {

        const url = urls[i];

        const tournamentId =
            extractTournamentId(url);


        if (!tournamentId) {

            arenas.push({

                name: "Invalid Arena URL",

                url: url,

                players: [],

                error: true

            });

            continue;

        }


        try {

            const data =
                await chessApi(tournamentId);


            const arena =
                parseTournamentData(
                    data,
                    url,
                    i + 1
                );


            arenas.push(arena);


            /*
                Combine players.
            */

            arena.players.forEach(player => {

                const username =
                    player.username.toLowerCase();


                if (!combinedPlayers[username]) {

                    combinedPlayers[username] = {

                        username:
                            player.username,

                        club:
                            player.club || "Unknown",

                        arenas: {},

                        total: 0

                    };

                }


                combinedPlayers[username]
                    .arenas[arena.name] =
                    player.points;


                combinedPlayers[username].total +=
                    Number(player.points) || 0;

            });


        } catch (error) {

            arenas.push({

                name:
                    "Arena " + (i + 1),

                url: url,

                players: [],

                error: true,

                errorMessage:
                    error.message

            });

        }

    }


    /*
        Build club totals from player data.
    */

    Object.values(combinedPlayers)
        .forEach(player => {

            const club =
                player.club || "Unknown";

            if (!combinedClubs[club]) {

                combinedClubs[club] = {

                    club: club,

                    arenas: {},

                    total: 0

                };

            }


            Object.entries(player.arenas)
                .forEach(([arena, points]) => {

                    if (!combinedClubs[club]
                        .arenas[arena]) {

                        combinedClubs[club]
                            .arenas[arena] = 0;

                    }


                    combinedClubs[club]
                        .arenas[arena] +=
                        Number(points) || 0;


                    combinedClubs[club].total +=
                        Number(points) || 0;

                });

        });


    renderResults(
        arenas,
        Object.values(combinedPlayers),
        Object.values(combinedClubs)
    );


    showStatus(
        "✅ Analysis complete."
    );
}


/* ==========================================================
   PARSE TOURNAMENT DATA
   ========================================================== */

function parseTournamentData(
    data,
    url,
    number
) {

    const name =
        data.name ||
        data.title ||
        ("Arena " + number);


    /*
        Chess.com's tournament API normally exposes
        a "players" array for tournament leaderboard data.

        We deliberately check several possible structures
        so the page does not crash if the API format changes.
    */

    let players = [];


    if (Array.isArray(data.players)) {

        players = data.players;

    } else if (
        data.players &&
        typeof data.players === "object"
    ) {

        players =
            Object.values(data.players);

    } else if (
        data.leaderboard &&
        Array.isArray(data.leaderboard)
    ) {

        players =
            data.leaderboard;

    }


    const parsedPlayers =
        players.map((player, index) => {

            const username =
                player.username ||
                player.name ||
                player.player ||
                player.handle ||
                "Unknown Player";


            const points =
                Number(
                    player.points ??
                    player.score ??
                    player.total ??
                    0
                );


            /*
                The tournament endpoint may not provide
                club information.

                We keep the field so that club data can be
                supported whenever the source provides it.
            */

            const club =
                player.club ||
                player.club_name ||
                player.team ||
                "Unknown";


            return {

                rank:
                    player.rank ||
                    index + 1,

                username:
                    username,

                club:
                    club,

                points:
                    points

            };

        });


    return {

        name:
            name,

        url:
            url,

        players:
            parsedPlayers,

        raw:
            data

    };

}


/* ==========================================================
   RENDER EVERYTHING
   ========================================================== */

function renderResults(
    arenas,
    players,
    clubs
) {

    document.getElementById("results")
        .style.display = "block";


    document.getElementById("arenaCount")
        .textContent =
            arenas.length;


    document.getElementById("playerCount")
        .textContent =
            players.length;


    document.getElementById("clubCount")
        .textContent =
            clubs.length;


    renderSeparateArenas(arenas);

    renderPlayers(arenas, players);

    renderClubs(arenas, clubs);

}


/* ==========================================================
   SEPARATE ARENAS
   ========================================================== */

function renderSeparateArenas(arenas) {

    const container =
        document.getElementById(
            "separateResults"
        );


    if (!arenas.length) {

        container.innerHTML =
            `<div class="empty">
                No Arena results.
             </div>`;

        return;

    }


    container.innerHTML =
        arenas.map(arena => {

            if (arena.error) {

                return `
                    <div class="card"
                         style="margin-bottom:12px;">

                        <div class="arena-name">
                            ⚠️ ${escapeHtml(arena.name)}
                        </div>

                        <div class="url-small">
                            ${escapeHtml(arena.url)}
                        </div>

                        <div class="empty">
                            ${
                                escapeHtml(
                                    arena.errorMessage ||
                                    "Could not retrieve this Arena."
                                )
                            }
                        </div>

                    </div>
                `;

            }


            if (!arena.players.length) {

                return `
                    <div class="card"
                         style="margin-bottom:12px;">

                        <div class="arena-name">
                            🏟️ ${escapeHtml(arena.name)}
                        </div>

                        <div class="url-small">
                            ${escapeHtml(arena.url)}
                        </div>

                        <div class="empty">

                            Chess.com returned no leaderboard
                            player data for this Arena.

                            <br><br>

                            The official PubAPI does not always
                            expose the complete Arena leaderboard.

                        </div>

                    </div>
                `;

            }


            const rows =
                arena.players
                    .sort((a, b) =>
                        Number(b.points) -
                        Number(a.points)
                    )
                    .map((player, index) => {

                        return `
                            <tr>

                                <td class="rank">
                                    ${index + 1}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        player.username
                                    )}
                                </td>

                                <td>
                                    ${escapeHtml(
                                        player.club
                                    )}
                                </td>

                                <td class="points">
                                    ${player.points}
                                </td>

                            </tr>
                        `;

                    })
                    .join("");


            return `
                <div class="card"
                     style="margin-bottom:15px;">

                    <div class="arena-name">
                        🏟️ ${escapeHtml(arena.name)}
                    </div>

                    <div class="url-small">
                        ${escapeHtml(arena.url)}
                    </div>

                    <br>

                    <div class="table-wrap">

                        <table>

                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Player</th>
                                    <th>Club</th>
                                    <th>Points</th>
                                </tr>
                            </thead>

                            <tbody>
                                ${rows}
                            </tbody>

                        </table>

                    </div>

                </div>
            `;

        })
        .join("");

}


/* ==========================================================
   COMBINED PLAYERS
   ========================================================== */

function renderPlayers(
    arenas,
    players
) {

    const container =
        document.getElementById(
            "playerResults"
        );


    if (!players.length) {

        container.innerHTML =
            `<div class="empty">
                No player data available.
             </div>`;

        return;

    }


    players.sort(
        (a, b) =>
            Number(b.total) -
            Number(a.total)
    );


    const arenaHeaders =
        arenas
            .map(arena =>
                `<th>
                    ${escapeHtml(arena.name)}
                 </th>`
            )
            .join("");


    const rows =
        players.map((player, index) => {

            const scores =
                arenas.map(arena => {

                    const score =
                        player.arenas[
                            arena.name
                        ] ?? 0;

                    return `
                        <td class="points">
                            ${score}
                        </td>
                    `;

                }).join("");


            return `
                <tr>

                    <td class="rank">
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(
                                player.username
                            )}
                        </strong>
                    </td>

                    <td>
                        ${escapeHtml(
                            player.club
                        )}
                    </td>

                    ${scores}

                    <td class="total">
                        ${player.total}
                    </td>

                </tr>
            `;

        }).join("");


    container.innerHTML = `
        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Player</th>

                        <th>Club</th>

                        ${arenaHeaders}

                        <th>Total</th>

                    </tr>

                </thead>

                <tbody>

                    ${rows}

                </tbody>

            </table>

        </div>
    `;

}


/* ==========================================================
   COMBINED CLUBS
   ========================================================== */

function renderClubs(
    arenas,
    clubs
) {

    const container =
        document.getElementById(
            "clubResults"
        );


    if (!clubs.length) {

        container.innerHTML =
            `<div class="empty">
                No club data available.
             </div>`;

        return;

    }


    clubs.sort(
        (a, b) =>
            Number(b.total) -
            Number(a.total)
    );


    const arenaHeaders =
        arenas.map(arena =>
            `<th>
                ${escapeHtml(arena.name)}
             </th>`
        ).join("");


    const rows =
        clubs.map((club, index) => {

            const scores =
                arenas.map(arena => {

                    const score =
                        club.arenas[
                            arena.name
                        ] ?? 0;

                    return `
                        <td class="points">
                            ${score}
                        </td>
                    `;

                }).join("");


            return `
                <tr>

                    <td class="rank">
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(
                                club.club
                            )}
                        </strong>
                    </td>

                    ${scores}

                    <td class="total">
                        ${club.total}
                    </td>

                </tr>
            `;

        }).join("");


    container.innerHTML = `
        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Club</th>

                        ${arenaHeaders}

                        <th>Total</th>

                    </tr>

                </thead>

                <tbody>

                    ${rows}

                </tbody>

            </table>

        </div>
    `;

}


/* ==========================================================
   CLEAR
   ========================================================== */

function clearAll() {

    document.getElementById("arenaInputs")
        .innerHTML = `
            <div class="arena-row">

                <input
                    class="arena-input"
                    type="url"
                    placeholder="https://www.chess.com/tournament/live/..."
                >

                <button
                    class="remove-btn"
                    onclick="removeArena(this)"
                >
                    ×
                </button>

            </div>
